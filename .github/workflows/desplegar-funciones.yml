# Publica las Edge Functions de Supabase (supabase/functions/*), p. ej. ndvi-huerta (mapa de vigor de Satélite).
# Corre al cambiar algo en supabase/functions en main, o a mano desde Actions → «Desplegar funciones» → Run workflow.
#
# Requiere UN secreto del repositorio (Settings → Secrets and variables → Actions → New repository secret):
#   SUPABASE_ACCESS_TOKEN   token personal de Supabase (supabase.com → Account → Access Tokens → Generate new token)
# Mientras no exista, el flujo termina sin hacer nada (no falla).
name: Desplegar funciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch: {}

concurrency:
  group: desplegar-funciones
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_REF: rnlnomhgtscmdqqyyyyz

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: ¿Hay token?
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN: no se despliega." >> "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.token.outputs.ok == 'true'
        with:
          sparse-checkout: supabase

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.ok == 'true'
        with:
          version: latest

      - name: Desplegar ndvi-huerta
        if: steps.token.outputs.ok == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy ndvi-huerta --project-ref "$PROJECT_REF" --use-api
