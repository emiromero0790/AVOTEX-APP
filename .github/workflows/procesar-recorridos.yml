# Procesa los recorridos que la app sube (fotos + GPS) con el modelo de AVOTEX.
# Corre cada 10 minutos y también a mano desde la pestaña Actions ("Run workflow").
# Nota de GitHub: los flujos programados solo corren desde la rama principal (main).
name: Procesar recorridos

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Nunca dos procesadores a la vez: el siguiente espera a que termine el anterior.
concurrency:
  group: procesar-recorridos
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: processor

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: processor/requirements.txt

      - name: Instalar dependencias
        run: pip install -r processor/requirements.txt

      - name: Pruebas rápidas
        run: python -m unittest discover -s processor/tests

      - name: Procesar recorridos pendientes
        working-directory: processor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODEL_URL: ${{ secrets.MODEL_URL }}
        run: python procesar_recorridos.py
